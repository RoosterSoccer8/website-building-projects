name: Flag lead from dashboard

# The dashboard's buttons ("Build this site", "Mark pitched", ...) open a
# pre-filled GitHub issue titled "<action>: <slug>". This picks that up,
# applies it, builds the preview when asked, replies with the link and
# closes the issue — so the whole pipeline runs from a phone.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  flag:
    # Only the repo owner can spend money here. The repo is public, so
    # anyone can open an issue — but only Connor's requests are acted on.
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Apply the requested change
        id: flag
        env:
          # Never interpolate issue text straight into a shell command.
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set +e
          out=$(python flag_lead.py "$ISSUE_TITLE")
          code=$?
          set -e
          echo "$out"
          {
            echo "result<<EOF"
            echo "$out" | sed -n 's/^RESULT://p'
            echo "EOF"
            echo "action=$(echo "$out" | sed -n 's/^ACTION://p')"
            echo "slug=$(echo "$out" | sed -n 's/^SLUG://p')"
            echo "ok=$([ $code -eq 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Build the preview
        if: steps.flag.outputs.ok == 'true' && steps.flag.outputs.action == 'build'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python generator.py "${{ steps.flag.outputs.slug }}"

      - name: Rebuild dashboard
        if: steps.flag.outputs.ok == 'true'
        run: python build_dashboard.py

      - name: Commit results
        if: steps.flag.outputs.ok == 'true'
        run: |
          git config user.name "lead-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add leads.json docs/
          git diff --cached --quiet || git commit -m "${{ steps.flag.outputs.action }}: ${{ steps.flag.outputs.slug }}"
          git pull --rebase origin main
          git push

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.flag.outputs.result }}
          OK: ${{ steps.flag.outputs.ok }}
          ACTION: ${{ steps.flag.outputs.action }}
          SLUG: ${{ steps.flag.outputs.slug }}
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ "$OK" = "true" ]; then
            body="$RESULT"
            if [ "$ACTION" = "build" ]; then
              body="$body

          **Preview:** $PAGES/sites/$SLUG/
          (give it a few seconds to go live)"
            fi
            body="$body

          [Back to the dashboard]($PAGES)"
          else
            body="${RESULT:-Something went wrong applying that request.} Nothing was changed."
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "$body"
          gh issue close "${{ github.event.issue.number }}"
